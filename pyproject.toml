[project]
name = "tempo-sec"
version = "0.1.0"
description = "Context-aware cybersecurity agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "litellm>=1.40.0",
    "instructor>=1.0.0",
    
    # Data validation
    "pydantic>=2.0.0",
    
    # Container management
    "docker>=7.0.0",
    
    # Browser automation
    "playwright>=1.40.0",
    
    # Async
    "aiofiles>=23.0.0",
    
    # Utilities
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    
    # Config
    "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
