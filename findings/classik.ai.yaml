findings:
- id: 4632a17b-7df0-46fc-a05d-c4d1eb574dba
  title: Firebase configuration (apiKey, projectId, storageBucket) exposed in client-side
    Next.js bundles
  severity: info
  status: confirmed
  attack_surface_id: 0b4455bc-b7ce-4728-8db4-a6ebfd4b640d
  description: The Firebase configuration object for project 'classik-ai' (apiKey,
    authDomain, projectId, storageBucket, messagingSenderId, appId) is present in
    publicly served Next.js static chunks. This leaks the project identifiers needed
    to interact with public Firebase APIs (Auth, Firestore, Storage). While Firebase
    API keys are not secret in client apps, the presence of these values enables discovery
    and targeted testing of the backend (e.g., account creation, rule probing).
  evidence: 'Extracted from /_next/static/chunks/* bundles. Example values found:
    apiKey=AIzaSyASEDVyFUnHL6iS6rg1ewPDywqvz3bqssE, authDomain=classik-ai.firebaseapp.com,
    projectId=classik-ai, storageBucket=classik-ai.firebasestorage.app, appId=1:287081183762:web:a6f8f34c5e770c810836cb.
    The chunks were enumerated and searched with curl/grep as part of the test workflow.'
  reproduction_steps:
  - 1) curl -sL https://www.classik.ai/ | grep -oE '/_next/static/chunks/[^" ]+\.js'
    | sort -u
  - 2) curl -sL https://www.classik.ai/_next/static/chunks/<chunk>.js | grep -nE 'apiKey|projectId|storageBucket|authDomain|appId'
  remediation: Storing Firebase apiKey in client-side code is expected for a client
    app; however, avoid embedding any additional secret configuration in public bundles.
    Ensure sensitive operations require server-side checks and minimize leaked metadata
    in source maps. Regularly audit public assets for sensitive strings.
  discovered_at: 2026-01-10 20:42:41.510313
  discovered_by: Testing Subagent (automated shell inspection of Next.js bundles)
  validated_by: shell (curl/grep search)
- id: ea557281-c0dd-4417-b2d7-114763fdb198
  title: Authenticated users cannot read or create /users documents via REST API (restricted
    Firestore rules)
  severity: info
  status: confirmed
  attack_surface_id: c1e863e7-2079-442e-ae20-c62f23c5ec49
  description: Using an authenticated idToken for test users, attempts to read the
    user's own document (GET /documents/users/<uid>), list the users collection, create
    a document at users/<uid>, and update isAdmin were rejected with 403 or returned
    404 (document not present). This indicates Firestore rules restrict client-side
    reads and writes to the users collection, likely requiring server-side processes
    to create user profiles.
  evidence: 'Sign-in succeeded for test users, but:

    - GET https://firestore.googleapis.com/v1/projects/classik-ai/databases/(default)/documents/users/<uid>
    returned 404 Not Found

    - GET https://firestore.googleapis.com/v1/projects/classik-ai/databases/(default)/documents/users?pageSize=50
    returned 403 PERMISSION_DENIED

    - POST to create document and PATCH to update isAdmin returned 403 PERMISSION_DENIED

    These were executed using Authorization: Bearer <idToken> obtained from identitytoolkit
    signInWithPassword.'
  reproduction_steps:
  - 1) Create user via POST to identitytoolkit accounts:signUp (returns idToken and
    localId)
  - 2) Sign in via signInWithPassword to get idToken
  - '3) Attempt GET/POST/PATCH to Firestore endpoints as described using Authorization:
    Bearer <idToken>'
  remediation: If the application requires client-side user profile creation, ensure
    rules only permit creation of documents for the authenticated user's own UID and
    validate fields server-side. Otherwise, maintain server-side creation with secure
    checks.
  discovered_at: 2026-01-10 20:42:56.593364
  discovered_by: Testing Subagent (curl authenticated REST calls)
  validated_by: shell (curl with Authorization header)
- id: c693b6f2-b958-4099-a634-09862dee4d7c
  title: Client-side role checks (isAdmin/role) present in public Next.js bundles
  severity: low
  status: confirmed
  attack_surface_id: 0b4455bc-b7ce-4728-8db4-a6ebfd4b640d
  description: The application's client-side JavaScript contains logic that checks
    a boolean `isAdmin` flag and a `role` field (defaulting to "student") on user
    objects. This reveals the application's authorization model and provides an attacker
    with clear targets to attempt privilege escalation or social engineering. Client-side
    checks are not authoritative and must be enforced server-side; exposing role semantics
    increases the attack surface.
  evidence: Discovered in /_next/static/chunks/* bundles when searching for 'isAdmin'
    and 'role' strings. The bundles also contained references to the 'users' collection
    and logic that conditionally shows admin UI if isAdmin is true.
  reproduction_steps:
  - 1) curl -sL https://www.classik.ai/ | grep -oE '/_next/static/chunks/[^" ]+\.js'
    | sort -u
  - 2) curl -sL https://www.classik.ai/_next/static/chunks/<chunk>.js | grep -nE 'isAdmin|role|users'
  remediation: Do not rely on client-side checks for authorization. Enforce role/privileges
    server-side (e.g., via Firebase custom claims, Cloud Functions, or secure Firestore
    rules). Avoid exposing internal role logic in public bundles where possible.
  discovered_at: 2026-01-10 20:43:18.249831
  discovered_by: Testing Subagent (curl + grep on Next.js chunks)
  validated_by: shell (curl/grep search)
- id: d2adf43c-e0d7-42d8-8740-fa0978b2029a
  title: Public user registration enabled via Identity Toolkit (accounts:signUp)
  severity: medium
  status: confirmed
  attack_surface_id: c1e863e7-2079-442e-ae20-c62f23c5ec49
  description: The Firebase Identity Toolkit API for project 'classik-ai' allows unauthenticated
    creation of new user accounts via the public Web API key (accounts:signUp). This
    permits anyone to register an account and obtain idTokens and refreshTokens, which
    may be abused for account creation, automation, or to probe backend authorization
    rules.
  evidence: 'Multiple signUp requests executed successfully using the project API
    key (example): POST https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyASEDVyFUnHL6iS6rg1ewPDywqvz3bqssE
    with body {"email":"pentest+firestoretest@example.com","password":"P@ssw0rd1234","returnSecureToken":true}
    returned localId: Nm7h2PiXysWrlWQxtdEdl543dyl2 and an idToken. Additional test
    accounts created: RpKfEWLQJdU9mER0Q3gTL4lSapi2, jhLao5twBmVimrxaVZbvrDEN3Qf2.
    The idToken can be used to make authenticated requests to Firestore/Storage (subject
    to rules).'
  reproduction_steps:
  - 1) Extract apiKey from client bundles (e.g. Ai...bqssE).
  - 2) POST to https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=<API_KEY>
    with JSON body {"email":"attacker@example.com","password":"P@ssw0rd1234","returnSecureToken":true}.
  - 3) Observe successful response with localId, idToken, and refreshToken.
  remediation: If public sign-up is undesired, disable free registration or require
    additional verification (email verification, CAPTCHA, invitation flow). Implement
    server-side checks (Cloud Functions or callable endpoints) for high-privilege
    operations and monitor for automated account creation.
  discovered_at: 2026-01-10 20:43:36.689940
  discovered_by: Testing Subagent (curl to Identity Toolkit)
  validated_by: shell (curl signUp responses)
- id: 644ba09a-4556-432f-8de7-02ee9c009617
  title: Unauthenticated Firestore and Storage access blocked (permissions enforced)
  severity: info
  status: confirmed
  attack_surface_id: c1e863e7-2079-442e-ae20-c62f23c5ec49
  description: Attempts to access Firestore documents and list Firebase Storage objects
    without authentication were rejected with PERMISSION_DENIED / Permission denied
    responses. This indicates that unauthenticated (public) reads and storage listings
    are blocked by backend security rules.
  evidence: '1) GET https://firestore.googleapis.com/v1/projects/classik-ai/databases/(default)/documents/users?pageSize=20&key=AIzaSyASEDVyFUnHL6iS6rg1ewPDywqvz3bqssE
    returned {"error":{"code":403,"message":"Missing or insufficient permissions.","status":"PERMISSION_DENIED"}}

    2) GET https://firebasestorage.googleapis.com/v0/b/classik-ai.firebasestorage.app/o?key=AIzaSyASEDVyFUnHL6iS6rg1ewPDywqvz3bqssE
    returned {"error":{"code":403,"message":"Permission denied."}}'
  reproduction_steps:
  - 1) Extract apiKey from client bundles.
  - 2) curl -sS "https://firestore.googleapis.com/v1/projects/classik-ai/databases/(default)/documents/users?pageSize=20&key=<API_KEY>"
  - 3) curl -sS "https://firebasestorage.googleapis.com/v0/b/classik-ai.firebasestorage.app/o?key=<API_KEY>"
  remediation: No remediation required — this is the correct secure behavior. Continue
    to ensure rules remain restrictive and monitor for unintended changes.
  discovered_at: 2026-01-10 20:44:15.630663
  discovered_by: Testing Subagent (curl unauthenticated requests)
  validated_by: shell (curl responses)
