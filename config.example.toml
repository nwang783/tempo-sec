# Tempo Sec Configuration
# Copy to config.toml and customize for your environment



[context]
# Maximum context tokens before triggering summarization
max_tokens = 100000
# Automatically suggest summarization for long outputs
auto_summarize = true
# Directory for saving context files
persistence_dir = "./contexts"
# Maximum characters to show per tool output
max_output_chars = 10000
# Save truncated outputs to files for AI access via file_read
save_truncated_outputs = true
# Directory for truncated output files
truncated_output_dir = "~/.tempo-sec/truncated_outputs"
# Hours before truncated output files expire
truncated_output_ttl_hours = 24

[workflow]
# Require explicit phase transitions via tool calls
enforce_phases = true
# Maximum steps per workflow phase
max_steps_per_phase = 20
# Hard limit on total agent steps
max_total_steps = 500

[branching]
# Maximum parallel branches (subagents)
max_branches = 5
# Maximum nesting depth for branches
max_branch_depth = 3
# Step limit per branch
branch_step_limit = 100

[container]
# Docker image for sandbox execution
image = "tempo-sec-base:latest"
# Container execution timeout (seconds)
timeout = 300

[scope]
# Allowed target domains (empty = all allowed)
allowed_domains = []
# Explicitly excluded domains
excluded_domains = []
# Whether to allow subdomains of allowexcluded_ips = ["192.168.1.1"]
allow_subdomains = true

[visualization]
enabled = true
port = 8080
auto_open_browser = true


[logging]
# Logging level: DEBUG, INFO, WARNING, ERROR
level = "INFO"
# Enable verbose output
verbose = false

[orchestrator]
# Maximum concurrent subagent dispatches for parallel execution
max_concurrent = 3

[manifest]
# Path to target manifest (for test_cycle.py)
# Uncomment and set when using the split recon/testing workflow
# path = "./manifests/target_manifest.json"
# Directory for saving manifests (for recon.py)
output_dir = "./manifests"

[email]
# Agent email used for signups (required for email tools)
# agent_email = "temposec.agent@gmail.com"
# IMAP server configuration
imap_host = "imap.gmail.com"
imap_port = 993
# Note: IMAP password should be set via TEMPO_IMAP_PASSWORD env var for security

[browser]
# Run browser in headless mode (no visible window)
headless = false
# Default timeout for browser operations (milliseconds)
default_timeout = 300000
# Viewport dimensions
viewport_width = 1280
viewport_height = 720