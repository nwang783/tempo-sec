<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Sec - Agent Execution</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Tempo Sec Execution Tree</h1>
            <div id="status" class="status disconnected">Disconnected</div>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div id="tree-container"></div>
            </div>

            <div class="right-panel">
                <div class="panel-header">Node Details</div>
                <div id="details-content" class="details-content">
                    <div class="placeholder-text">Select a node to view details</div>
                </div>

                <div class="state-section">
                    <div class="panel-header">Agent State</div>
                    <div id="agent-state-content">
                        <div class="state-item">
                            <span class="label">Model:</span>
                            <span id="state-model" class="value">-</span>
                        </div>
                        <div class="state-item">
                            <span class="label">Phase:</span>
                            <span id="state-phase" class="value">-</span>
                        </div>
                        <div class="state-item">
                            <span class="label">Step:</span>
                            <span id="state-step" class="value">-</span>
                        </div>
                        <div class="state-item">
                            <span class="label">Latest:</span>
                            <span id="state-latest" class="value">-</span>
                        </div>
                    </div>
                </div>

                <div class="cost-section">
                    <div class="panel-header">Run Cost</div>
                    <div id="cost-content">
                        <div class="cost-item cost-total-row">
                            <span class="label">Total Cost:</span>
                            <span id="cost-total" class="value cost-value">$0.0000</span>
                        </div>
                        <div class="cost-item">
                            <span class="label">Cached:</span>
                            <span id="cost-cached" class="value">0 tokens</span>
                        </div>
                        <div class="cost-breakdown">
                            <div class="cost-item small">
                                <span class="label">Prompt:</span>
                                <span id="cost-prompt" class="value">0</span>
                            </div>
                            <div class="cost-item small">
                                <span class="label">Completion:</span>
                                <span id="cost-completion" class="value">0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="prompt-section">
                    <div class="panel-header">Send Prompt to Agent</div>
                    <div class="prompt-form">
                        <textarea id="prompt-input"
                            placeholder="Enter a prompt to inject into the agent's context..."></textarea>
                        <button id="send-prompt-btn">Send Prompt</button>
                    </div>
                    <div id="prompt-status" class="prompt-status"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
